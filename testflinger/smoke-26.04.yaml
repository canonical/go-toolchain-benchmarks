# Smoke test: Ubuntu 26.04 LTS on chakron (single-agent queue => fixed DUT).
# Validates: distro acceptance, dependencies, toolchain download + checksum,
# pinned clone, sweet build, sweet asset fetch. Non-ephemeral provisioning:
# ephemeral (in-memory) deployments do not have enough space for sweet assets.
job_queue: chakron
global_timeout: 10800
output_timeout: 1800
tags:
  - go-benchmark
  - smoke
  - ubuntu-26.04
  - amd64
provision_data:
  distro: resolute
test_data:
  attachments:
    - local: ../versions.env
    - local: ../scripts/dut-setup.sh
    - local: ../scripts/dut-metadata.sh
  test_cmds: |
    set -x
    SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    SCP="scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    $SCP attachments/test/versions.env attachments/test/dut-setup.sh attachments/test/dut-metadata.sh ubuntu@$DEVICE_IP:
    $SSH ubuntu@$DEVICE_IP 'set -o pipefail; bash dut-setup.sh 2>&1 | tee setup.log'
    SETUP_RC=$?
    $SSH ubuntu@$DEVICE_IP 'set -o pipefail; bash dut-metadata.sh 2>&1 | tee metadata.log' || true
    $SSH ubuntu@$DEVICE_IP 'cd /home/ubuntu && tar czf /tmp/artifacts.tgz --ignore-failed-read bench-out setup.log metadata.log' || true
    mkdir -p artifacts
    $SCP ubuntu@$DEVICE_IP:/tmp/artifacts.tgz artifacts/ || true
    (cd artifacts && tar xzf artifacts.tgz && rm -f artifacts.tgz) || true
    exit $SETUP_RC
