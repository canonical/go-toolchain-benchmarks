# Full campaign: Ubuntu 26.04 LTS (control) on chakron.
# chakron is a single-agent queue => guaranteed same physical DUT as the
# 26.10 job. Submit both full jobs back-to-back so no shared-queue job can
# claim the machine between them (all shared queues had 0 waiting jobs).
#
# Non-ephemeral provisioning: benchmarks (notably CockroachDB via Sweet)
# must run on real persistent storage.
job_queue: chakron
global_timeout: 86400
output_timeout: 3600
tags:
  - go-benchmark
  - go1.26.7-vs-go1.27.0
  - ubuntu-26.04
  - amd64
provision_data:
  distro: resolute
test_data:
  attachments:
    - local: ../versions.env
    - local: ../scripts/dut-setup.sh
    - local: ../scripts/dut-metadata.sh
    - local: ../scripts/dut-benchmark.sh
    - local: ../scripts/sweet-config.toml
  test_cmds: |
    set -x
    SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    SCP="scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    $SCP attachments/test/versions.env attachments/test/dut-setup.sh attachments/test/dut-metadata.sh attachments/test/dut-benchmark.sh attachments/test/sweet-config.toml ubuntu@$DEVICE_IP:
    $SSH ubuntu@$DEVICE_IP 'set -o pipefail; bash dut-setup.sh 2>&1 | tee setup.log'
    SETUP_RC=$?
    $SSH ubuntu@$DEVICE_IP 'set -o pipefail; bash dut-metadata.sh 2>&1 | tee metadata.log' || true
    $SSH ubuntu@$DEVICE_IP 'set -o pipefail; bash dut-benchmark.sh 2>&1 | tee benchmark-run.log' || true
    # Always collect artifacts, even on failure.
    $SSH ubuntu@$DEVICE_IP 'cd /home/ubuntu && tar czf /tmp/artifacts.tgz --ignore-failed-read bench-out setup.log metadata.log benchmark-run.log' || true
    mkdir -p artifacts
    $SCP ubuntu@$DEVICE_IP:/tmp/artifacts.tgz artifacts/ || true
    (cd artifacts && tar xzf artifacts.tgz && rm -f artifacts.tgz) || true
    exit $SETUP_RC
